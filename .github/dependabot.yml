version: 2

# Without this file Dependabot only opens security PRs. Enabling version
# updates means routine bumps get proposed too, and the auto-merge workflow
# lands the non-major ones on its own once CI passes.
updates:
  - package-ecosystem: npm
    directory: /api
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Root package.json: dev tooling only (ESLint).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  # Keeps the actions in ci.yml, codeql.yml and dependabot-auto-merge.yml
  # current -- they are dependencies too, and nothing else was watching them.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
