name: Dependabot auto-merge

# pull_request_target runs in the context of the base branch, which is what
# gives GITHUB_TOKEN write access -- on a plain `pull_request` event Dependabot
# PRs only get a read-only token and cannot enable auto-merge.
#
# This is only safe because the job never checks out or executes the PR's code.
# It reads metadata and calls the API. Do not add an actions/checkout step here.
on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Enable auto-merge
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Major bumps can carry breaking changes that a smoke test will not catch,
      # so they stay manual. Everything else merges once the required checks in
      # ci.yml pass -- auto-merge waits for them, it does not bypass them.
      - name: Enable auto-merge for non-major updates
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Leave majors to a human
        if: steps.metadata.outputs.update-type == 'version-update:semver-major'
        run: |
          gh pr comment "$PR_URL" --body \
            "Major version bump — not auto-merged. Review the changelog before merging."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
