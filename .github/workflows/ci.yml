name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  api:
    name: API (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: api/package-lock.json

      # `npm ci` fails outright if package.json and package-lock.json have
      # drifted apart, which is the first thing to catch on a Dependabot bump.
      - name: Install dependencies
        run: npm ci

      - name: Smoke test the API
        run: npm test

  browser:
    name: Front-end (headless Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # index.html is plain static files with CDN scripts, so there is nothing
      # to install: the test serves the repo and drives the browser over CDP.
      - name: Drive index.html in a real browser
        run: node test/browser.js

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Fails the build on any known low-or-worse advisory, so a bump that pulls
      # in a vulnerable transitive dependency does not get merged silently.
      - name: npm audit
        run: npm audit --audit-level=low
