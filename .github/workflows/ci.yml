name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

env:
  NODE_VERSION: '24'

# Job names are deliberately version-free: they are required contexts in the
# master branch protection rule, so baking a Node version into a name would
# make a future bump silently block every PR on a check that no longer runs.
# Change NODE_VERSION above, not the job names.
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install tooling
        run: npm ci

      - name: ESLint
        run: npm run lint

  # These used to run inside the API jobs. Removing the API without moving them
  # would have dropped eight tests of the generator itself -- the one piece of
  # code the whole site exists to run -- without anything reporting a gap.
  generator:
    name: Generator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Test the generator
        run: node test/generator.js

  browser:
    name: Front-end (headless Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Nothing to install: the page ships no npm dependencies, and the test
      # serves the repo and drives the browser over CDP.
      - name: Drive index.html in a real browser
        run: node test/browser.js

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install tooling
        run: npm ci

      # The site now ships no npm dependencies at all -- what remains here is
      # ESLint and its tree, which never reaches a visitor. Threshold raised
      # from `low` accordingly: a minor advisory in a lint dependency is worth
      # knowing about, not worth blocking a page that does not include it.
      # zxcvbn is vendored and tracked in js/vendor/README.md, not by npm.
      - name: npm audit
        run: npm audit --audit-level=high
