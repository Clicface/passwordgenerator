name: Deploy to Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# Pages currently publishes the gh-pages branch, whose last commit is from
# 2013. This replaces that with master, and uploads only what the site needs:
# api/, test/ and the tooling files have no business being served.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead. Cancelling mid-deploy could leave
# the site half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the static site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r css js langpack _site/
          cp favicon.svg favicon.png _site/

      - name: Fail if the API or tests leaked into the upload
        run: |
          for unwanted in api test node_modules package.json eslint.config.js; do
            if [ -e "_site/$unwanted" ]; then
              echo "::error::_site/$unwanted should not be published"
              exit 1
            fi
          done
          test -f _site/index.html

      # Every local file index.html references must be in the upload. Derived
      # from the page rather than a hardcoded list: the previous version
      # asserted jquery.min.js was present and broke the deploy the moment
      # jQuery was removed, which is exactly how a fixed list rots.
      - name: Fail if the page references something that was not published
        run: |
          missing=0
          for ref in $(grep -oE '(src|href)="[^"]+"' _site/index.html | cut -d'"' -f2); do
            case "$ref" in
              http*|//*|\#*|data:*) continue ;;
            esac
            if [ ! -f "_site/$ref" ]; then
              echo "::error::index.html references $ref, which is not in the upload"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "published tree:"
          find _site -type f | sort

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
